name: Python tests

on:
  push:
    branches: [master, feature/chess-game-upgrade]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q Main.py main.py Board.py MiniMax.py Evaluation.py tests
      - run: python -m unittest discover -s tests -v
